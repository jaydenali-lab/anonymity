name: "${project.name}"
version: "${project.version}"
main: dev.anonymity.AnonymityPlugin
api-version: '1.21'
description: "Scrambled name, hidden skin, enchantment aura and obfuscated kill messages."
author: Anonymity
commands:
  anonymous:
    description: Toggle anonymous mode - scrambled name, hidden skin and an enchantment aura.
    usage: /anonymous
    aliases: [anon]
    permission: anonymity.use
permissions:
  anonymity.use:
    description: Allows toggling anonymous mode on yourself. Operators only by default.
    default: op
