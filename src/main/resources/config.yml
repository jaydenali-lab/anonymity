# Anonymity configuration.

# The skin applied while a player is anonymous.
# These are a Mojang-signed texture (value + signature) so other players
# actually render the skin. This is _lotu's skin (slim model), which is the
# same texture as https://namemc.com/skin/35e202697eb4000e.
# To use a different skin, paste a new signed "value" and "signature" here
# (e.g. another player's, or one generated via https://mineskin.org).
skin:
  value: ""
  signature: ""

# The scrambled ("unintelligible letters") name. It is rendered with the
# Minecraft magic/obfuscated formatting code so the characters constantly cycle.
name:
  # A fresh random token of this length is generated each time a player goes
  # anonymous, so two anonymous players never look identical.
  min-length: 7
  max-length: 9

# The enchantment-table particle aura that surrounds an anonymous player.
particles:
  enabled: true
  # How often to emit a burst, in server ticks (20 ticks = 1 second).
  interval-ticks: 4
  # Particles per burst.
  count: 10
  # Horizontal/vertical spread of the aura around the body.
  radius: 0.6
  # Red dust colour/size used by the tether trail and the transform cutscene.
  color:
    red: 200
    green: 0
    blue: 0
  size: 1.5

# The tornado transform cutscene played when toggling anonymous mode on/off.
cutscene:
  enabled: true
  # Wind-up length in ticks (20 = 1 second). The transform lands at the end.
  windup-ticks: 24

# Infinite combat buffs while anonymous. Potion particles are hidden.
effects:
  enabled: true
  strength-amplifier: 1   # 0 = Strength I, 1 = Strength II
  speed-amplifier: 1      # 0 = Speed I, 1 = Speed II

# Replace the player's armour with a trimmed netherite set while anonymous,
# restoring their own armour when they leave anonymous mode.
armor:
  enabled: true

# Rewrite death messages so an anonymous killer (or victim) shows the
# scrambled name instead of their real username.
death-messages: true
