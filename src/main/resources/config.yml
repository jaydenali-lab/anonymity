# Anonymity configuration.

# The skin applied while a player is anonymous.
# These are a Mojang-signed texture (value + signature) so other players
# actually render the skin. This pair corresponds to:
#   https://namemc.com/skin/35e202697eb4000e
# To use a different skin, generate a new signed pair (e.g. via https://mineskin.org)
# and paste the "value" and "signature" here.
skin:
  value: ""
  signature: ""

# The scrambled ("unintelligible letters") name. It is rendered with the
# Minecraft magic/obfuscated formatting code so the characters constantly cycle.
name:
  # A fresh random token of this length is generated each time a player goes
  # anonymous, so two anonymous players never look identical.
  min-length: 7
  max-length: 9

# The enchantment-table particle aura that surrounds an anonymous player.
particles:
  enabled: true
  # How often to emit a burst, in server ticks (20 ticks = 1 second).
  interval-ticks: 4
  # Particles per burst.
  count: 10
  # Horizontal/vertical spread of the aura around the body.
  radius: 0.6

# Rewrite death messages so an anonymous killer (or victim) shows the
# scrambled name instead of their real username.
death-messages: true
